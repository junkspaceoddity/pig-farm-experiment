<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dutch Pig Farms</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 1. Load the free MapLibre map engine -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // 2. Create the map centered on the Netherlands
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', // Free dark basemap
      center: [5.3, 52.1],
      zoom: 7
    });

    // 3. Load your GeoJSON and draw circles
    map.on('load', () => {
      map.addSource('farms', { type: 'geojson', data: 'farms.geojson' });

      map.addLayer({
        id: 'farm-points',
        type: 'circle',
        source: 'farms',
        paint: {
          'circle-radius': 4,
          'circle-color': '#ff4d88',
          'circle-opacity': 0.8
        }
      });

      // 4. Show a popup when a dot is clicked
      map.on('click', 'farm-points', (e) => {
        const props = e.features[0].properties;
        new maplibregl.Popup()
          .setLngLat(e.features[0].geometry.coordinates)
          .setHTML(`<strong>Pigs:</strong> ${props.PIG || 'Unknown'}`)
          .addTo(map);
      });
    });
  </script>
</body>
</html>
